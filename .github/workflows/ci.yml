name: BeeAcademy Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend CI (Java 21 / Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: 'backend/pom.xml'

      - name: Fix line endings and permissions for Maven Wrapper
        run: |
          sed -i -e 's/\r$//' mvnw
          chmod +x mvnw

      - name: Run Maven Verify (Compile, Test, Package)
        env:
          MAVEN_PROJECTBASEDIR: ${{ github.workspace }}/backend
        run: ./mvnw -B clean verify

      - name: Validate Dockerfile Build
        run: docker build -t beeacademy-backend:ci .

  frontend-ci:
    name: Frontend CI (React 19 / TypeScript / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Quality Check (Lint)
        run: npm run lint

      - name: Build Production Bundle
        run: npm run build

  ci-gate:
    name: CI Quality Gate
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Checks Passed
        run: echo "All backend and frontend quality checks passed successfully. Ready for deployment."

